spring.application.name=chess
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

server.port=${PORT:8080}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.show-sql=false

app.game.persistence.flush-interval-ms=${GAME_FLUSH_INTERVAL_MS:3000}
app.game.cache.ttl-seconds=${GAME_CACHE_TTL_SECONDS:21600}

jwt.expiration=${JWT_EXPIRATION_MS:86400000}
google.oauth.client-id=${GOOGLE_OAUTH_CLIENT_ID}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
app.upload.dir=${APP_UPLOAD_DIR:/tmp/uploads}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true