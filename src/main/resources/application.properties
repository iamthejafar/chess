spring.application.name=chess
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

server.port=${PORT:8080}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.show-sql=false

app.game.persistence.flush-interval-ms=3000
app.game.cache.ttl-seconds=21600
jwt.expiration=86400000
google.oauth.client-id=272958348093-m9niul4u2k0geh1mfcdbst28sgl62r9j.apps.googleusercontent.com
app.upload.dir=${APP_UPLOAD_DIR:/tmp/uploads}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true