# Local/dev defaults only
spring.datasource.url=${DB_URL:jdbc:h2:mem:chessdb-dev;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.data.redis.url=redis://localhost:6379
jwt.secret=dev-only-change-me-to-a-32-byte-secret-key

app.cors.allowed-origins=http://localhost:5123, http://localhost:5124
