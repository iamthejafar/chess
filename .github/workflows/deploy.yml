name: CI/CD

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Build JAR (Maven)
        run: mvn -B package -DskipTests

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/chess-backend:latest
            ghcr.io/${{ github.repository_owner }}/chess-backend:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: read

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          SPRING_PROFILES_ACTIVE: ${{ secrets.SPRING_PROFILES_ACTIVE }}
          PORT: ${{ secrets.PORT }}
          DB_URL: ${{ secrets.DB_URL }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_EXPIRATION_MS: ${{ secrets.JWT_EXPIRATION_MS }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          APP_CORS_ALLOWED_ORIGINS: ${{ secrets.APP_CORS_ALLOWED_ORIGINS }}
          APP_UPLOAD_DIR: ${{ secrets.APP_UPLOAD_DIR }}
          APP_VERSION: ${{ github.sha }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          envs: GHCR_TOKEN,GHCR_USER,SPRING_PROFILES_ACTIVE,PORT,DB_URL,DB_USER,DB_PASSWORD,REDIS_URL,JWT_SECRET,JWT_EXPIRATION_MS,GOOGLE_OAUTH_CLIENT_ID,APP_CORS_ALLOWED_ORIGINS,APP_UPLOAD_DIR,APP_VERSION
          script_stop: true
          script: |
            set -e

            # Write .env securely using env vars (no secret interpolation in script body)
            cat > /app/.env << EOF
            SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}
            PORT=${PORT}
            DB_URL=${DB_URL}
            DB_USER=${DB_USER}
            DB_PASSWORD=${DB_PASSWORD}
            REDIS_URL=${REDIS_URL}
            JWT_SECRET=${JWT_SECRET}
            JWT_EXPIRATION_MS=${JWT_EXPIRATION_MS}
            GOOGLE_OAUTH_CLIENT_ID=${GOOGLE_OAUTH_CLIENT_ID}
            APP_CORS_ALLOWED_ORIGINS=${APP_CORS_ALLOWED_ORIGINS}
            APP_UPLOAD_DIR=${APP_UPLOAD_DIR}
            APP_VERSION=${APP_VERSION}
            EOF
            chmod 600 /app/.env

            echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USER}" --password-stdin

            docker compose -f /app/docker-compose.yml pull
            docker compose -f /app/docker-compose.yml up -d --remove-orphans

            docker image prune -f